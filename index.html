<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f1f5f6">
<title>Перепустка — дані</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <main class="form-screen">
      <h1>Документи</h1>
      <p class="subtitle">Заповніть дані для створення перепустки</p>

      <form id="passForm" class="pass-form">
        <label class="field">
          <span>Гуртожиток</span>
          <select id="dorm" required>
            <option value="1">№1 — вул. Бой-Желенського, 14</option>
            <option value="3">№3 — вул. І. Карпінця, 27</option>
            <option value="4" selected>№4 — вул. Академіка А. Сахарова, 25</option>
            <option value="5">№5 — вул. Лукаша, 4</option>
            <option value="6">№6 — вул. Академіка А. Сахарова, 27</option>
            <option value="7">№7 — вул. Лукаша, 1</option>
            <option value="8">№8 — вул. Академіка А. Сахарова, 23</option>
            <option value="9">№9 — вул. Лукаша, 2</option>
            <option value="10">№10 — вул. Відкрита, 1</option>
            <option value="11">№11 — вул. Лукаша, 5</option>
            <option value="12">№12 — вул. Академіка Лазаренка, 38</option>
            <option value="14">№14 — вул. Академіка Лазаренка, 40</option>
            <option value="15">№15 — вул. Академіка Лазаренка, 42</option>
            <option value="17">№17 — вул. Пулюя І., 33а</option>
            <option value="18">№18 — м. Львів, вул. Плужника, 5</option>
            <option value="19">№19 — м. Львів-смт. Брюховичі, вул. Сухомлинського, 18</option>
            <option value="21">№21 — м. Львів, вул. Пулюя І., 33</option>
            <option value="22">№22 — м. Львів, вул. В. Великого, 57 (5 під’їзд)</option>
          </select>
          <small id="dormContact" class="field-hint"></small>
        </label>

        <label class="field">
          <span>Номер кімнати</span>
          <input id="room" type="text" placeholder="напр. 411б" required>
        </label>

        <label class="field">
          <span>Прізвище</span>
          <input id="lastname" type="text" placeholder="Гірний" required>
        </label>

        <label class="field">
          <span>Ім'я</span>
          <input id="firstname" type="text" placeholder="Роман" required>
        </label>

        <label class="field">
          <span>По батькові</span>
          <input id="middlename" type="text" placeholder="Дмитрович" required>
        </label>

        <button type="submit" class="primary-btn">Створити перепустку</button>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
